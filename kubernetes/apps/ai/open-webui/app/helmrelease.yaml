---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: open-webui
  values:
    ollama:
      enabled: false

    pipelines:
      enabled: false

    websocket:
      manager: ""
      redis:
        enabled: false

    route:
      enabled: true
      hostnames:
        - open-webui.nasenov.dev
      parentRefs:
        - name: envoy-internal
          namespace: networking

    openaiBaseApiUrl: http://qwen3-5-4b.ai.svc.cluster.local:8080/v1
