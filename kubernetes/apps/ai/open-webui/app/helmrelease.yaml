---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: open-webui
  values:
    ollama:
      enabled: false

    pipelines:
      enabled: false

    websocket:
      manager: ""
      redis:
        enabled: false

    workload:
      kind: Deployment

    strategy:
      type: Recreate

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

    copyAppData:
      command: ["true"]

    image:
      useSlim: true

    extraEnvVars:
      - name: WEBUI_URL
        value: https://open-webui.nasenov.dev
      - name: WEBUI_AUTH
        value: "False"
      - name: WEBUI_SECRET_KEY_FILE
        value: /app/backend/data/.webui_secret_key
      - name: TASK_MODEL_EXTERNAL
        value: qwen3.5-0.8b
      - name: RAG_EMBEDDING_ENGINE
        value: openai
      - name: RAG_EMBEDDING_MODEL
        value: qwen3-embedding-0.6b
      - name: RAG_OPENAI_API_BASE_URL
        value: http://qwen3-embedding-0-6b.ai.svc.cluster.local:8080/v1
      - name: ENABLE_RAG_HYBRID_SEARCH
        value: "true"
      - name: RAG_RERANKING_ENGINE
        value: external
      - name: RAG_RERANKING_MODEL
        value: qwen3-reranker-0.6b
      - name: RAG_EXTERNAL_RERANKER_URL
        value: http://qwen3-reranker-0-6b.ai.svc.cluster.local:8080/v1/rerank

    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /health/db
        port: http
      periodSeconds: 10
      failureThreshold: 3

    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi

    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    route:
      enabled: true
      hostnames:
        - open-webui.nasenov.dev
      parentRefs:
        - name: envoy-internal
          namespace: networking

    persistence:
      existingClaim: open-webui

    volumes:
      - name: static
        emptyDir: {}
      - name: tmp
        emptyDir: {}

    volumeMounts:
      container:
        - name: static
          mountPath: /app/backend/open_webui/static
        - name: tmp
          mountPath: /tmp

    openaiBaseApiUrls:
      - http://qwen3-5-2b.ai.svc.cluster.local:8080/v1
      - http://qwen3-5-0-8b.ai.svc.cluster.local:8080/v1
