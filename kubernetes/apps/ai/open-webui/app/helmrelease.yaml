---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: open-webui
  values:
    ollama:
      enabled: false

    pipelines:
      enabled: false

    websocket:
      manager: ""
      redis:
        enabled: false

    workload:
      kind: Deployment

    strategy:
      type: Recreate

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

    copyAppData:
      command: ["true"]

    image:
      useSlim: true

    extraEnvVars:
      - name: WEBUI_URL
        value: https://open-webui.nasenov.dev
      - name: WEBUI_AUTH
        value: "False"
      - name: WEBUI_SECRET_KEY_FILE
        value: /app/backend/data/.webui_secret_key

    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /health/db
        port: http
      periodSeconds: 10
      failureThreshold: 3

    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi

    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    route:
      enabled: true
      hostnames:
        - open-webui.nasenov.dev
      parentRefs:
        - name: envoy-internal
          namespace: networking

    persistence:
      size: 1Gi

    volumes:
      - name: static
        emptyDir: {}
      - name: tmp
        emptyDir: {}

    volumeMounts:
      container:
        - name: static
          mountPath: /app/backend/open_webui/static
        - name: tmp
          mountPath: /tmp

    openaiBaseApiUrl: http://qwen3-5-4b.ai.svc.cluster.local:8080/v1
