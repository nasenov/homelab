---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    template:
      data:
        API_SERVER_KEY: "{{ .HERMES_AGENT_API_SERVER_KEY }}"
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "{{ .HERMES_AGENT_DASHBOARD_USERNAME }}"
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ .HERMES_AGENT_DASHBOARD_PASSWORD }}"
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: "{{ .HERMES_AGENT_DASHBOARD_SECRET }}"
  data:
    - secretKey: HERMES_AGENT_API_SERVER_KEY
      remoteRef:
        key: 5dbdd7e7-54b4-494e-a985-b50500c56106
    - secretKey: HERMES_AGENT_DASHBOARD_USERNAME
      remoteRef:
        key: 406861b2-e400-4552-a27b-b50500cd28fa
    - secretKey: HERMES_AGENT_DASHBOARD_PASSWORD
      remoteRef:
        key: 5f12f314-f317-46cc-a51b-b50500cd48c8
    - secretKey: HERMES_AGENT_DASHBOARD_SECRET
      remoteRef:
        key: 0c6fede5-f1ae-4ff5-8967-b50500ccfccc
