---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: agentgateway
  values:
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi

    gateway:
      service:
        type: ClusterIP
      extraServices:
        - name: ui
          type: ClusterIP
          ports:
            - name: http
              port: 80
              targetPort: 4001

    monitoring:
      enabled: true

    config:
      config:
        session:
          key: disabled

      gateways:
        default:
          port: 4000
        ui-gateway:
          port: 4001

      ui:
        gateways:
          - ui-gateway

      llm:
        models:
          - name: qwen3.5-0.8b
            provider:
              custom:
                formats:
                  - type: completions
            params:
              model: qwen3.5-0.8b
              baseUrl: http://qwen3-5-0-8b.ai.svc.cluster.local:8080/v1

      mcp:
        targets:
          - name: flux-operator
            mcp:
              host: http://flux-operator-mcp.flux-system.svc.cluster.local:9090/mcp
          - name: grafana
            mcp:
              host: http://grafana-mcp.observability.svc.cluster.local:8000/mcp
          - name: unifi
            mcp:
              host: http://unifi-mcp.default.svc.cluster.local:3000/mcp
