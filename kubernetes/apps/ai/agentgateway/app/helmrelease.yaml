---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: agentgateway
  values:
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi

    gateway:
      service:
        type: ClusterIP

    monitoring:
      enabled: true

    config:
      config:
        session:
          key: disabled

      gateways:
        default:
          port: 4000

      ui:
        gateways:
          - default

      mcp:
        targets:
          - name: flux-operator
            mcp:
              host: http://flux-operator-mcp.flux-system.svc.cluster.local:9090/mcp
          - name: grafana
            mcp:
              host: http://grafana-mcp.observability.svc.cluster.local:8000/mcp
          - name: unifi
            mcp:
              host: http://unifi-mcp.default.svc.cluster.local:3000/mcp
