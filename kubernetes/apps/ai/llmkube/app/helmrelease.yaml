---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: llmkube
  values:
    namespace: ai

    controllerManager:
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 256Mi

    prometheus:
      serviceMonitor:
        enabled: true
      inferencePodMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        namespace: ai

    grafana:
      dashboards:
        enabled: true
        operator:
          enabled: true
          instanceSelector:
            matchLabels:
              dashboards: grafana
