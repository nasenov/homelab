---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
spec:
  interval: 1h
  targetNamespace: observability
  path: ./kubernetes/apps/observability/grafana-operator/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: grafana-operator
    namespace: flux-system
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-instance
spec:
  interval: 1h
  targetNamespace: observability
  components:
    - ../../../../components/cnpg/initdb
  dependsOn:
    - name: barman-cloud
      namespace: database
    - name: cloudnative-pg-catalog
      namespace: database
    - name: grafana-operator
      namespace: observability
  path: ./kubernetes/apps/observability/grafana-operator/instance
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: grafana-operator
    namespace: flux-system
  postBuild:
    substitute:
      APP: grafana
  patches:
    - patch: |-
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: ${APP}-postgres
        spec:
          bootstrap:
            initdb:
              import:
                type: microservice
                databases:
                  - grafana
                source:
                  externalCluster: shared
          externalClusters:
            - name: shared
              connectionParameters:
                host: postgres-rw.database.svc.cluster.local
                user: postgres
                dbname: postgres
                sslmode: require
              password:
                name: grafana-postgres-migration
                key: password
