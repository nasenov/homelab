---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  disableDefaultAdminSecret: true

  deployment:
    spec:
      replicas: 2

      template:
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      dashboards: grafana
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana
                      key: GF_SECURITY_ADMIN_PASSWORD
              envFrom:
                - secretRef:
                    name: grafana
                - secretRef:
                    name: grafana-postgres

  httpRoute:
    spec:
      hostnames:
        - grafana.nasenov.dev
      parentRefs:
        - name: envoy-internal
          namespace: networking

  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "true"
    auth.generic_oauth:
      enabled: "true"
      name: PocketID
      auth_url: https://id.nasenov.dev/authorize
      token_url: https://id.nasenov.dev/api/oidc/token
      api_url: https://id.nasenov.dev/api/oidc/userinfo
      scopes: openid email profile groups
      allow_assign_grafana_admin: "true"
      role_attribute_path: contains(groups[*], 'admins') && 'GrafanaAdmin' || 'Viewer'
      use_pkce: "true"
      validate_id_token: "true"
      jwk_set_url: https://id.nasenov.dev/.well-known/jwks.json
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
      preinstall_auto_update: "false"
    database:
      type: postgres
      host: postgres-rw.database.svc.cluster.local:5432
      max_open_conn: "4"
      ssl_mode: require
    server:
      enable_gzip: "true"
      root_url: https://grafana.nasenov.dev
