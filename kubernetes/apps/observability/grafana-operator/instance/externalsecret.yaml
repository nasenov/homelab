---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    template:
      data:
        GF_SECURITY_ADMIN_USER: "{{ .GRAFANA_ADMIN_USER }}"
        GF_SECURITY_ADMIN_PASSWORD: "{{ .GRAFANA_ADMIN_PASSWORD }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .GRAFANA_OIDC_CLIENT_ID }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .GRAFANA_OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: GRAFANA_ADMIN_USER
      remoteRef:
        key: 17cd932a-05c8-4dda-8802-8260ee7be4b5
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: 18b35110-1819-4524-b291-cd4ac935d9db
    - secretKey: GRAFANA_OIDC_CLIENT_ID
      remoteRef:
        key: 6fad97dd-4509-4334-af46-b50b00cec379
    - secretKey: GRAFANA_OIDC_CLIENT_SECRET
      remoteRef:
        key: d57655d0-e0eb-4de9-a5df-b50b00cedabc
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: postgres
  target:
    template:
      data:
        GF_DATABASE_NAME: "{{ .username }}"
        GF_DATABASE_USER: "{{ .username }}"
        GF_DATABASE_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: postgres-grafana
