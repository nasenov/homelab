---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafana.yaml
  - ./grafanadatasource.yaml
  - ./servicemonitor.yaml
patches:
  - patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: ${APP}-postgres
      spec:
        bootstrap:
          initdb:
            import:
              type: microservice
              databases:
                - grafana
              source:
                externalCluster: shared
        externalClusters:
          - name: shared
            connectionParameters:
              host: postgres-rw.database.svc.cluster.local
              user: postgres
              dbname: postgres
              sslmode: require
            password:
              name: grafana-postgres-migration
              key: password
