---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  # External Group
  - name: cstrike
    group: external
    url: udp://cs.nasenov.dev:27015
    conditions:
      - "[CONNECTED] == true"
  - name: flux-webhook
    group: external
    url: https://flux-webhook.nasenov.dev/hook
    conditions:
      - "[STATUS] == 404"
  - name: kromgo
    group: external
    url: https://kromgo.nasenov.dev
    conditions:
      - "[STATUS] == 200"

  # Internal Group
  - name: actual
    group: internal
    url: https://actual.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: alertmanger
    group: internal
    url: https://alertmanager.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: audiobookshelf
    group: internal
    url: https://audiobookshelf.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: autobrr
    group: internal
    url: https://autobrr.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: bazarr
    group: internal
    url: https://bazarr.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: flux-operator
    group: internal
    url: https://flux-operator.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: flux-operator-mcp
    group: internal
    url: https://flux-operator-mcp.nasenov.dev/mcp
    method: POST
    headers:
      Content-Type: application/json
    body: '{"jsonrpc":"2.0","id":1,"method":"ping"}'
    conditions:
      - "[STATUS] == 200"
  - name: grafana
    group: internal
    url: https://grafana.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: home-assistant
    group: internal
    url: https://home-assistant.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: jellyfin
    group: internal
    url: https://jellyfin.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: k8s
    group: internal
    url: https://k8s.nasenov.dev:6443/readyz
    conditions:
      - "[STATUS] == 200"
  - name: miniflux
    group: internal
    url: https://miniflux.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: miscale2pg
    group: internal
    url: https://miscale2pg.nasenov.dev/actuator/health/readiness
    conditions:
      - "[STATUS] == 200"
  - name: open-webui
    group: internal
    url: https://open-webui.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: postgres
    group: internal
    url: tcp://postgres.nasenov.dev:5432
    conditions:
      - "[CONNECTED] == true"
  - name: prometheus
    group: internal
    url: https://prometheus.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: prowlarr
    group: internal
    url: https://prowlarr.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: qbittorrent
    group: internal
    url: https://qbittorrent.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: qui
    group: internal
    url: https://qui.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: radarr
    group: internal
    url: https://radarr.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: rook
    group: internal
    url: https://rook.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: seerr
    group: internal
    url: https://seerr.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: sonarr
    group: internal
    url: https://sonarr.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: thelounge
    group: internal
    url: https://thelounge.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: victoria-logs
    group: internal
    url: https://victoria-logs.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: vikunja
    group: internal
    url: https://vikunja.nasenov.dev/health
    conditions:
      - "[STATUS] == 200"

  # Infrastructure Group
  - name: garage
    group: infrastructure
    url: https://garage.truenas.nasenov.dev/health
    conditions:
      - "[STATUS] == 200"
  - name: meshcentral
    group: infrastructure
    url: https://meshcentral.truenas.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: traefik
    group: infrastructure
    url: https://traefik.truenas.nasenov.dev
    conditions:
      - "[STATUS] == 200"
  - name: truenas
    group: infrastructure
    url: https://truenas.nasenov.dev
    conditions:
      - "[STATUS] == 200"

metrics: true

storage:
  type: sqlite
  path: ${GATUS_CONFIG_PATH}/gatus.db
  caching: true

ui:
  title: Status | Gatus
  header: Status

web:
  port: ${GATUS_WEB_PORT}
