---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: grafana-mcp
  values:
    grafana:
      url: http://grafana-service.observability.svc.cluster.local:3000
      apiKeySecret:
        name: grafana-mcp
        key: token

    serverAuth:
      token: null

    disableWrite: true

    extraArgs:
      - --transport=streamable-http
      - --allowed-hosts=grafana-mcp.nasenov.dev

    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi

    metrics:
      enabled: true
      port: 8080

    serviceMonitor:
      enabled: true

    route:
      main:
        enabled: true
        hostnames:
          - grafana-mcp.nasenov.dev
        parentRefs:
          - name: envoy-internal
            namespace: networking
