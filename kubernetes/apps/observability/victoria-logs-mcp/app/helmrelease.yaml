---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-mcp
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-mcp
      ref:
        tag: 0.2.0
  values:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000

    env:
      - name: MCP_LOG_FORMAT
        value: json
      - name: MCP_LOG_LEVEL
        value: warn

    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    vl:
      entrypoint: http://victoria-logs.observability.svc.cluster.local:9428
