---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cstrike
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cstrike
  values:
    controllers:
      cstrike:
        containers:
          app:
            image:
              repository: ghcr.io/gameservermanagers/gameserver
              tag: cs@sha256:2c45ed34793aa787bfdbc39a3fded58007c8354a7216dd854a9a73d6590ea786
            env:
              LGSM_GITHUBUSER: nasenov
              LGSM_GITHUBREPO: LinuxGSM
              LGSM_GITHUBBRANCH: fix/bump-amxmodx-version
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

    service:
      app:
        ports:
          game:
            port: 27015
            protocol: UDP

    route:
      app:
        kind: UDPRoute
        parentRefs:
          - name: envoy-external
            namespace: networking

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
