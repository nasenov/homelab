---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cstrike
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cstrike
  values:
    controllers:
      cstrike:
        containers:
          app:
            image:
              repository: ghcr.io/gameservermanagers/gameserver
              tag: cs@sha256:410ad62d5c4b049c6f02b96cf3f9c0327becc9f5fff972dcb96e3f239850e13c
            env:
              LGSM_GITHUBBRANCH: develop
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
          fastdl:
            image:
              repository: ghcr.io/nginx/nginx-unprivileged
              tag: 1.31.8@sha256:e1d940677c62963156c6aad83001f37955e58b74343481503c3761d340fb8bb9
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          game:
            port: &gamePort 27015
            protocol: UDP
          http:
            port: &httpPort 8080

    route:
      app:
        kind: UDPRoute
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *gamePort
      fastdl:
        annotations:
          external-dns.kubernetes.io/controller: none
        hostnames:
          - cs.nasenov.dev
        parentRefs:
          - name: envoy-external
            namespace: networking
            sectionName: cstrike-fastdl
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          cstrike:
            app:
              - path: /data
      fastdl:
        forceRename: cstrike-fastdl
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          cstrike:
            app:
              - path: /app/public_html
            fastdl:
              - path: /usr/share/nginx/html
                readOnly: true
      tmp:
        type: emptyDir
