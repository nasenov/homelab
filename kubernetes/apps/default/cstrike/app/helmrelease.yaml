---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cstrike
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cstrike
  values:
    controllers:
      cstrike:
        containers:
          app:
            image:
              repository: ghcr.io/gameservermanagers/gameserver
              tag: cs@sha256:5c9ea75061a9f14a80f5b694408ff0caea44d300b46b75b0e0d1a93a3826dc9d
            env:
              LGSM_GITHUBBRANCH: develop
            resources:
              requests:
                cpu: 200m
              limits:
                memory: 1Gi
          fastdl:
            image:
              repository: ghcr.io/nginx/nginx-unprivileged
              tag: 1.31.8@sha256:e4264279b179f0e654579a90a1a9c1eab3ba9124c17551794bee20f68a38b5ce
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: cs.nasenov.dev
          lbipam.cilium.io/ips: 192.168.30.125
        externalTrafficPolicy: Local
        ports:
          game:
            port: 27015
            protocol: UDP
          http:
            port: 27015
            targetPort: 8080

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          cstrike:
            app:
              - path: /data
      fastdl:
        forceRename: cstrike-fastdl
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          cstrike:
            app:
              - path: /app/public_html
            fastdl:
              - path: /usr/share/nginx/html
                readOnly: true
      tmp:
        type: emptyDir
