---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cstrike
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cstrike
  values:
    controllers:
      cstrike:
        containers:
          app:
            image:
              repository: ghcr.io/gameservermanagers/gameserver
              tag: cs@sha256:4539d5a30c85c4de0241c8d43d678eb62a3dff316ab3335258304f544036e974
            env:
              LGSM_GITHUBBRANCH: develop
            resources:
              requests:
                cpu: 200m
              limits:
                memory: 1Gi
          fastdl:
            image:
              repository: ghcr.io/nginx/nginx-unprivileged
              tag: 1.31.10@sha256:a3ee8631f59c109deead35eef91f428233151b50ed5ee433057f3a93ca570c2c
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: cs.nasenov.dev
          lbipam.cilium.io/ips: 192.168.30.125
        externalTrafficPolicy: Local
        allocateLoadBalancerNodePorts: false
        ports:
          game:
            port: 27015
            protocol: UDP
          http:
            port: 27015
            targetPort: 8080

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          cstrike:
            app:
              - path: /data
      fastdl:
        forceRename: cstrike-fastdl
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          cstrike:
            app:
              - path: /app/public_html
            fastdl:
              - path: /usr/share/nginx/html
                readOnly: true
      tmp:
        type: emptyDir
