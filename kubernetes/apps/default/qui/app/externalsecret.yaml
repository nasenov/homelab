---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    template:
      data:
        QUI__SESSION_SECRET: "{{ .QUI_SESSION_SECRET }}"
        QUI__OIDC_CLIENT_ID: "{{ .QUI_OIDC_CLIENT_ID }}"
        QUI__OIDC_CLIENT_SECRET: "{{ .QUI_OIDC_CLIENT_SECRET }}"
        QUI__OIDC_ALLOWED_EMAIL: "{{ .QUI_OIDC_ALLOWED_EMAIL }}"
  data:
    - secretKey: QUI_SESSION_SECRET
      remoteRef:
        key: 91d2776a-a288-48b4-8ef2-5df7730b260d
    - secretKey: QUI_OIDC_CLIENT_ID
      remoteRef:
        key: bc18e2fb-d139-413f-8b2f-b50a0134df6a
    - secretKey: QUI_OIDC_CLIENT_SECRET
      remoteRef:
        key: 08a94ce9-36ce-4efd-a7b3-b50a0134f7a7
    - secretKey: QUI_OIDC_ALLOWED_EMAIL
      remoteRef:
        key: dca2d194-811d-4ff1-aca6-b50a01365257
