---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    template:
      data:
        OAUTH2_CLIENT_ID: "{{ .MINIFLUX_OIDC_CLIENT_ID }}"
        OAUTH2_CLIENT_SECRET: "{{ .MINIFLUX_OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: MINIFLUX_OIDC_CLIENT_ID
      remoteRef:
        key: c1d278fc-9be8-427c-a84f-b50b00c1ac43
    - secretKey: MINIFLUX_OIDC_CLIENT_SECRET
      remoteRef:
        key: 1b9ed312-d63b-4de9-8784-b50b00c1c2a0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: postgres
  target:
    template:
      data:
        DATABASE_URL: "host=postgres-rw.database.svc.cluster.local port=5432 dbname={{ .username }} user={{ .username }} password={{ .password }}"
        RUN_MIGRATIONS: "1"
  dataFrom:
    - extract:
        key: postgres-miniflux
