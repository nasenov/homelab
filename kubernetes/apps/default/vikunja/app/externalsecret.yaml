    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    template:
      data:
        VIKUNJA_SERVICE_SECRET: "{{ .VIKUNJA_SERVICE_SECRET }}"
        VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTID: "{{ .VIKUNJA_OIDC_CLIENT_ID }}"
        VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTSECRET: "{{ .VIKUNJA_OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: VIKUNJA_SERVICE_SECRET
      remoteRef:
        key: 18784dc4-2e50-4c2b-9d53-b50000f79d2e
    - secretKey: VIKUNJA_OIDC_CLIENT_ID
      remoteRef:
        key: 45488164-e148-4657-a8ca-b50a01059821
    - secretKey: VIKUNJA_OIDC_CLIENT_SECRET
      remoteRef:
        key: 00d1b8f2-7493-4e66-95d4-b50a0105b68f
