      remoteRef:
        key: 6e7ca0c9-e134-450d-8b3a-b50b0099d6ff
    - secretKey: AUTOBRR_OIDC_CLIENT_SECRET
      remoteRef:
        key: 242962e1-4aa5-4182-9c07-b50b0099ec62
