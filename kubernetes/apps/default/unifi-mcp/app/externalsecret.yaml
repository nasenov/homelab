---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    template:
      data:
        UNIFI_USERNAME: "{{ .UNIFI_MCP_UNIFI_USERNAME }}"
        UNIFI_PASSWORD: "{{ .UNIFI_MCP_UNIFI_PASSWORD }}"
  data:
    - secretKey: UNIFI_MCP_UNIFI_USERNAME
      remoteRef:
        key: f33a5691-8d54-42a5-b547-b500011161be
    - secretKey: UNIFI_MCP_UNIFI_PASSWORD
      remoteRef:
        key: e854a372-3842-491d-8ed0-b5000111783f
