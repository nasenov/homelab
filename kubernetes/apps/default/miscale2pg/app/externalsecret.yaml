---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miscale2pg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    template:
      data:
        APP_ZEPP_LIFE_APP_TOKEN: "{{ .ZEPP_LIFE_APP_TOKEN }}"
        APP_ZEPP_LIFE_USER_ID: "{{ .ZEPP_LIFE_USER_ID }}"
        APP_ZEPP_LIFE_EMAIL: "{{ .ZEPP_LIFE_EMAIL }}"
  data:
    - secretKey: ZEPP_LIFE_APP_TOKEN
      remoteRef:
        key: ddd056d2-4650-49e3-90e1-b4f200cc7347
    - secretKey: ZEPP_LIFE_USER_ID
      remoteRef:
        key: ccef4007-80d7-48d7-8cfb-b4f200cc8da3
    - secretKey: ZEPP_LIFE_EMAIL
      remoteRef:
        key: 0c0f6ee6-9969-4f97-a59c-b4f200cca7c8
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miscale2pg-database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: postgres
  target:
    template:
      data:
        SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-rw.database.svc.cluster.local:5432/{{ .username }}"
        SPRING_DATASOURCE_USERNAME: "{{ .username }}"
        SPRING_DATASOURCE_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: postgres-miscale2pg
