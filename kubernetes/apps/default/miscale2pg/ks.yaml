---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miscale2pg
spec:
  interval: 1h
  targetNamespace: default
  components:
    - ../../../../components/cnpg
  dependsOn:
    - name: barman-cloud
      namespace: database
    - name: cloudnative-pg-catalog
      namespace: database
  path: ./kubernetes/apps/default/miscale2pg/app
  prune: true
  sourceRef:
    kind: ExternalArtifact
    name: miscale2pg
    namespace: flux-system
  postBuild:
    substitute:
      APP: miscale2pg
      CNPG_MAJOR: "19"
