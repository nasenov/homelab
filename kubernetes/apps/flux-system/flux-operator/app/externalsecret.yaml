---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-web-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    template:
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux-operator.nasenov.dev
            authentication:
              type: OAuth2
              oauth2:
                provider: OIDC
                clientID: "{{ .FLUX_OPERATOR_OIDC_CLIENT_ID }}"
                clientSecret: "{{ .FLUX_OPERATOR_OIDC_CLIENT_SECRET }}"
                issuerURL: https://id.nasenov.dev
  data:
    - secretKey: FLUX_OPERATOR_OIDC_CLIENT_ID
      remoteRef:
        key: debad7da-d473-4b2f-911c-b50b00aa0f8a
    - secretKey: FLUX_OPERATOR_OIDC_CLIENT_SECRET
      remoteRef:
        key: 91cf90d8-5555-4d16-9352-b50b00aa1e14
