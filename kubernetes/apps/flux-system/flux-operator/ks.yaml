---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
spec:
  interval: 1h
  targetNamespace: flux-system
  path: ./kubernetes/apps/flux-system/flux-operator/app
  prune: false
  # If source-watcher is down, point this and flux-instance at the flux-system GitRepository to apply a fix from Git
  sourceRef:
    kind: ExternalArtifact
    name: flux-operator
    namespace: flux-system
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
spec:
  interval: 1h
  targetNamespace: flux-system
  dependsOn:
    - name: flux-operator
      namespace: flux-system
  path: ./kubernetes/apps/flux-system/flux-operator/instance
  prune: false
  # If source-watcher is down, point this and flux-operator at the flux-system GitRepository to apply a fix from Git
  sourceRef:
    kind: ExternalArtifact
    name: flux-operator
    namespace: flux-system
