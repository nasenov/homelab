---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator-mcp
  values:
    readonly: true

    networkPolicy:
      create: false

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: null
        memory: 128Mi

    httpRoute:
      enabled: true
      hostnames:
        - flux-operator-mcp.nasenov.dev
      parentRefs:
        - name: envoy-internal
          namespace: networking
