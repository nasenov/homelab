---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentrouter
spec:
  interval: 1h
  targetNamespace: networking
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: agentrouter-crds
      namespace: networking
    - name: envoy-gateway
      namespace: networking
  path: ./kubernetes/apps/networking/agentrouter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentrouter-config
spec:
  interval: 1h
  targetNamespace: networking
  dependsOn:
    - name: agentrouter
      namespace: networking
  path: ./kubernetes/apps/networking/agentrouter/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
