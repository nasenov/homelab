---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentrouter-mcp-clients
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    template:
      data:
        claude-code: "{{ .AGENTROUTER_CLAUDE_CODE_API_KEY }}"
        hermes-agent: "{{ .AGENTROUTER_HERMES_AGENT_API_KEY }}"
  data:
    - secretKey: AGENTROUTER_CLAUDE_CODE_API_KEY
      remoteRef:
        key: 1a9e6627-26c8-4608-b7a8-b5050115065d
    - secretKey: AGENTROUTER_HERMES_AGENT_API_KEY
      remoteRef:
        key: 65e9dcb8-b8ab-40a4-84e4-b50501152ef8
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentrouter-vikunja-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    template:
      data:
        apiKey: "{{ .VIKUNJA_MCP_TOKEN }}"
  data:
    - secretKey: VIKUNJA_MCP_TOKEN
      remoteRef:
        key: c7f88f6a-015e-468a-b869-b505010ea343
