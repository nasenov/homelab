---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: mcp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
  hostnames:
    - mcp.nasenov.dev
  path: /
  securityPolicy:
    apiKeyAuth:
      credentialRefs:
        - name: agentrouter-mcp-clients
      extractFrom:
        - headers:
            - Authorization
      sanitize: true
      forwardClientIDHeader: x-client-id
  backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: flux-operator
    - group: gateway.envoyproxy.io
      kind: Backend
      name: grafana
    - group: gateway.envoyproxy.io
      kind: Backend
      name: unifi
    - group: gateway.envoyproxy.io
      kind: Backend
      name: victoria-logs
    - group: gateway.envoyproxy.io
      kind: Backend
      name: vikunja
      path: /api/v2/mcp
      securityPolicy:
        apiKey:
          secretRef:
            name: agentrouter-vikunja-mcp
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: flux-operator
spec:
  endpoints:
    - fqdn:
        hostname: flux-operator-mcp.flux-system.svc.cluster.local
        port: 9090
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: grafana
spec:
  endpoints:
    - fqdn:
        hostname: grafana-mcp.observability.svc.cluster.local
        port: 8000
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: unifi
spec:
  endpoints:
    - fqdn:
        hostname: unifi-mcp.ai.svc.cluster.local
        port: 3000
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: victoria-logs
spec:
  endpoints:
    - fqdn:
        hostname: victoria-logs-mcp.observability.svc.cluster.local
        port: 8080
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: vikunja
spec:
  endpoints:
    - fqdn:
        hostname: vikunja.default.svc.cluster.local
        port: 80
