---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: mcp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
  path: /
  hostnames:
    - mcp.nasenov.dev
  backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: flux-operator
    - group: gateway.envoyproxy.io
      kind: Backend
      name: grafana
    - group: gateway.envoyproxy.io
      kind: Backend
      name: unifi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: flux-operator
spec:
  endpoints:
    - fqdn:
        hostname: flux-operator-mcp.flux-system.svc.cluster.local
        port: 9090
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: grafana
spec:
  endpoints:
    - fqdn:
        hostname: grafana-mcp.observability.svc.cluster.local
        port: 8000
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: unifi
spec:
  endpoints:
    - fqdn:
        hostname: unifi-mcp.ai.svc.cluster.local
        port: 3000
