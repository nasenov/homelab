---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-secrets
  values:
    bitwarden-sdk-server:
      enabled: true

      resources:
        requests:
          cpu: 10m
        limits:
          memory: 32Mi

      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop:
            - ALL

    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi

    serviceMonitor:
      enabled: true

    grafanaDashboard:
      enabled: true

    webhook:
      replicaCount: 2

      podDisruptionBudget:
        enabled: true

      resources:
        requests:
          cpu: 10m
        limits:
          memory: 64Mi

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: external-secrets-webhook

    certController:
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 64Mi
