---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 1h
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/rook/rook-ceph
      ref:
        tag: 1.21.3
  values:
    image:
      repository: ghcr.io/rook/ceph

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 512Mi

    ceph-csi-operator:
      controllerManager:
        manager:
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: null
              memory: 128Mi

    monitoring:
      enabled: true
