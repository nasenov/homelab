# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  targetNamespace: rook-ceph
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
  path: ./kubernetes/apps/rook-ceph/rook-ceph/drivers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ceph-csi-drivers
      namespace: rook-ceph
    - apiVersion: apps/v1
      kind: Deployment
      name: rook-ceph.rbd.csi.ceph.com-ctrlplugin
      namespace: rook-ceph
    - apiVersion: apps/v1
      kind: DaemonSet
      name: rook-ceph.rbd.csi.ceph.com-nodeplugin
      namespace: rook-ceph
