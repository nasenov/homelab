---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  values:
    config:
      clusterWide: false

    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi

    monitoring:
      podMonitorEnabled: true
      grafanaDashboard:
        create: true
