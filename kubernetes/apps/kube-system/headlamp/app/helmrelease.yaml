---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 1h
  chart:
    spec:
      chart: headlamp
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  values:
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.8.0
        installOptions:
          parallel: true

    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi

    httpRoute:
      enabled: true
      hostnames:
        - headlamp.nasenov.dev
      parentRefs:
        - name: envoy-internal
          namespace: networking
