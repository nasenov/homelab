---
apiVersion: v1alpha1
kind: FilesystemScrubConfig
interval: 168h0m0s
---
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: openebs
volumeType: disk
provisioning:
  diskSelector:
    match: disk.model == "Samsung SSD 870"
filesystem:
  type: xfs
  projectQuotaSupport: true
